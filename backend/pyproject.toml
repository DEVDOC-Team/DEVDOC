[tool.pytest.ini_options]
testpaths = ["tests", "orchestrator/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "F821",   # undefined name — false positive for SQLAlchemy forward-ref relationships
    "UP042",  # use StrEnum — our str+Enum pattern is compatible with pydantic and SQLAlchemy
    "B008",   # do not perform function call in argument defaults (standard FastAPI Depends pattern)
]


[tool.ruff.lint.per-file-ignores]
# Test and script files need sys.path manipulation before imports
"tests/*" = ["F401", "E402"]
"orchestrator/tests/*" = ["F401", "E402"]
"scripts/*" = ["E402"]

