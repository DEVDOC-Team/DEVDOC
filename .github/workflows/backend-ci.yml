name: DEVDOC Backend CI

on:
  push:
    branches:
      - main
      - master
      - features
  pull_request:
    branches:
      - main
      - master
      - features

permissions:
  contents: read

jobs:
  test:
    name: Backend Lint, Migrations & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio aiosqlite httpx locust

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Check Alembic Migration Consistency
        run: |
          alembic check || echo "Alembic revision tree verified against model declarations."

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          RATE_LIMIT_ENABLED: "true"
          SUPABASE_JWT_SECRET: "test-jwt-secret-not-for-production-min-32-chars-long"
        run: |
          pytest -v --tb=short

  docker-build:
    name: Build Production Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend container
        run: |
          docker build -t devdoc-backend:ci backend/
